[tool.ruff]
target-version = "py38"
line-length = 100
extend-exclude = [
    "Aptamer-Validation/Snakefile",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # long lines are common in this scientific code; the formatter wraps what it can
]

[tool.ruff.lint.per-file-ignores]
"Aptamer-Validation/Snakefile" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
